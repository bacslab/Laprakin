name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # server/src/db.js memakai node:sqlite bawaan, tersedia sejak Node 22.5.
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:audit

  # Gerbang rilis. Branch `release` hanya maju ketika unit test dan audit lulus,
  # dan VM production hanya men-deploy dari branch ini. Dengan begitu commit yang
  # gagal test tidak pernah sampai ke pengguna, tanpa perlu membuka port apa pun
  # ke runner GitHub.
  release:
    needs: [unit, audit]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Majukan branch release ke commit yang lulus
        run: git push origin "${{ github.sha }}:refs/heads/release"
