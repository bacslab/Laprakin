name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # server/src/db.js memakai node:sqlite bawaan, tersedia sejak Node 22.5.
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm test

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npm run test:audit

  secret-scan:
    name: Secret scan (Gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Gitleaks 8.30.1
        shell: bash
        env:
          GITLEAKS_VERSION: '8.30.1'
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            --output "$archive"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan full Git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --verbose --exit-code 1 .

  sast:
    name: SAST (Semgrep CE)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: semgrep/semgrep:1.174.0
    steps:
      - uses: actions/checkout@v4
      - name: Scan JavaScript and TypeScript
        run: >-
          semgrep scan
          --config p/javascript
          --config p/typescript
          --error
          --metrics=off
          --timeout 30
          .

  vulnerability-scan:
    name: Filesystem vulnerabilities (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Fail on fixable high or critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # Gerbang rilis. Branch `release` hanya maju ketika test, audit dependency,
  # secret scan, SAST, dan vulnerability scan lulus. VM production hanya
  # men-deploy dari branch ini, sehingga commit yang gagal gate tidak pernah
  # sampai ke pengguna tanpa perlu membuka port apa pun ke runner GitHub.
  release:
    needs: [unit, audit, secret-scan, sast, vulnerability-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Majukan branch release ke commit yang lulus
        run: git push origin "${{ github.sha }}:refs/heads/release" --force
